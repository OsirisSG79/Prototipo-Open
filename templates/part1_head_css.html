  <style>
    :root {
      --bg-white: #FFFFFF;
      --bg-warm: #FBFBFB;
      --bg-gray-subtle: #F8F9FA;
      --bg-dark: #111111;
      --bg-card-dark: #18181B;
      --border-subtle: rgba(17, 17, 17, 0.08);
      --border-dark: rgba(255, 255, 255, 0.12);
      --text-black: #111111;
      --text-editorial: #666666;
      --text-secondary: #888888;
      --text-white: #FFFFFF;
      --accent-orange: #FF5500;
      --accent-orange-hover: #E04B00;
      --accent-yellow: #FFDD00;
      --accent-green: #10B981;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease-primary: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-cinematic: cubic-bezier(0.65, 0, 0.35, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      background: var(--bg-warm);
      overflow-x: hidden;
      width: 100%;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-warm);
      color: var(--text-black);
      overflow-x: hidden;
      width: 100%;
      position: relative;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Accesibilidad: Reducción de movimiento */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      #custom-cursor { display: none !important; }
    }

    /* Cursor contextual para puntero fino */
    @media (pointer: fine) and (hover: hover) {
      body { cursor: default; }
      #custom-cursor {
        position: fixed;
        width: 14px;
        height: 14px;
        background: var(--accent-orange);
        border-radius: 50%;
        pointer-events: none;
        z-index: 99999;
        transform: translate(-50%, -50%);
        transition: width 0.25s var(--ease-primary), height 0.25s var(--ease-primary), background 0.25s ease, opacity 0.2s ease;
        mix-blend-mode: multiply;
        opacity: 0.9;
      }
      #custom-cursor.active {
        width: 44px;
        height: 44px;
        background: var(--accent-yellow);
        opacity: 0.85;
      }
    }
    @media (pointer: coarse) {
      #custom-cursor { display: none; }
    }

    /* Top Announcement Banner (OB-04: Transparente y creíble) */
    .top-announcement-banner {
      background: var(--accent-yellow);
      color: #111111;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 9px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: -0.01em;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .top-announcement-banner .pill {
      background: #111111;
      color: #FFFFFF;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* Navbar (OB-10: Menú Móvil Accesible) */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(251, 251, 251, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-black);
      font-weight: 800;
      font-size: 1.22rem;
      letter-spacing: -0.03em;
    }
    .nav-brand-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-orange);
      border-radius: 50%;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-editorial);
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .nav-links a:hover, .nav-links a:focus-visible {
      color: var(--text-black);
      outline: 2px solid var(--accent-orange);
      outline-offset: 4px;
      border-radius: 4px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mobile-menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-black);
    }
    .mobile-drawer {
      display: none;
      position: fixed;
      top: 65px; left: 0; right: 0;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-subtle);
      padding: 24px;
      flex-direction: column;
      gap: 16px;
      z-index: 999;
      box-shadow: 0 15px 30px rgba(0,0,0,0.08);
    }
    .mobile-drawer.open { display: flex; }
    .mobile-drawer a {
      text-decoration: none;
      color: var(--text-black);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-subtle);
      padding: 9px 20px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-black);
      cursor: pointer;
      transition: all 0.25s var(--ease-primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.2);
    }
    .btn-primary {
      background: var(--text-black);
      color: var(--text-white);
      border: none;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s var(--ease-primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary:hover {
      background: var(--accent-orange);
      transform: translateY(-1px);
    }
    .btn-primary:focus-visible, .btn-secondary:focus-visible {
      outline: 2px solid var(--accent-orange);
      outline-offset: 3px;
    }
